# Keeps dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two things here are deliberate rather than cosmetic:
#
# `commit-message.prefix` decides whether a bump reaches the changelog and cuts
# a release. The rule is "does this change what users install?" —
#   yes -> `fix`, so release-please opens a release PR with a visible entry
#   no  -> `chore`, hidden from the changelog and never a release on its own
# Both images are consumed as `:latest` by docker-compose.yaml, so a base image
# or dependency bump is exactly the kind of thing that should get a version.
# Stated explicitly rather than left to Dependabot's inference from commit
# history, which now contains `fix(deps)` commits too.
#
# `groups:` — without it Dependabot opens one PR per dependency, which is a
# Monday review queue of a dozen near-identical PRs. Grouped, each ecosystem
# gives one PR that either goes green or does not.
#
# release-please-config.json is a monorepo config keyed on `webui/backend` and
# `webui/frontend`, so a bump only ever affects the component whose directory it
# touches. vendor/ has no entry here on purpose: it is a verbatim copy of
# upstream, refreshed only by vendor/update.sh.
version: 2
updates:
  # Workflow actions are pinned to floating major tags, so without this they
  # drift silently and never surface a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    # CI-only: never a release on its own.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # FastAPI and friends, installed into the published backend image.
  - package-ecosystem: "pip"
    directory: "/webui/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      backend:
        patterns: ["*"]

  # The `python:3.12-slim` base image in webui/backend/Dockerfile — the OS and
  # interpreter users actually run.
  - package-ecosystem: "docker"
    directory: "/webui/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"

  # React, Vite and the build toolchain. Everything in this manifest —
  # devDependencies included — is part of the build that produces the published
  # image, so `fix` across the board rather than splitting by dependency-type:
  # bumping vite or typescript changes the bundle users get just as much as
  # bumping react does.
  - package-ecosystem: "npm"
    directory: "/webui/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      frontend:
        patterns: ["*"]

  # The `node:22-alpine` build stage and the `nginx:alpine` runtime stage in
  # webui/frontend/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/webui/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
