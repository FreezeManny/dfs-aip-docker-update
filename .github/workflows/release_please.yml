name: Release Please

on:
  push:
    branches:
      - main

# Two merges in quick succession would otherwise race to update the same
# release PR; the newest wins, and an in-flight run is left to finish.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # One config and manifest per component. A shared manifest puts both
      # versions on adjacent lines of the same file, so concurrent release PRs
      # collide there and whichever merges second has to be rebased.
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT rather than GITHUB_TOKEN: releases created with the default
          # token do not emit events, so Publish — which is `on: release` —
          # would never fire.
          token: ${{ secrets.ACTIONS_TOKEN }}
          config-file: .github/release-please/backend-config.json
          manifest-file: .github/release-please/backend-manifest.json

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.ACTIONS_TOKEN }}
          config-file: .github/release-please/frontend-config.json
          manifest-file: .github/release-please/frontend-manifest.json
