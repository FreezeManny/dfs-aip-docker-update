name: PR Title

# Every PR lands on main as exactly one squash commit whose message is the PR
# title, so the title is the only string release-please ever reads — and the
# only one that has to be Conventional. Checking it here replaces the old
# per-commit lint (commit-lint.yml plus a local commit-msg hook): commits
# inside a branch are yours to name `wip` or `fixup`, because none of them
# reach main or the changelog.
on:
  # `pr-title` is a required check (see the job comment below), and required
  # checks are validated per commit SHA. Without `synchronize`, pushing a new
  # commit leaves no check run for that SHA at all, so the PR hangs on
  # "Expected — waiting for status to be reported" until someone manually
  # re-runs the workflow. Including it re-checks an unchanged title on every
  # push, but that's cheap, and it's the only way each new commit gets its own
  # passing check.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

# Editing a title several times in a row supersedes the earlier checks.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Named `pr-title` because the branch ruleset on main requires that check by
  # name; renaming the job silently un-gates the branch.
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed conventional-commit types. Keep in sync with the
          # release-please changelog sections.
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            ci
            build
            perf
            style
            revert
